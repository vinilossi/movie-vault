<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <title>MovieVault — Discover your next favorite movie.</title>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Popular Movies</h1>
      </div>
      <div class="search-bar">
        <input
          type="search"
          id="search-movie"
          placeholder="Enter a movie to search for..."
        />
        <button type="submit" class="search-btn" aria-label="Search">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
            />
          </svg>
        </button>
      </div>
      <div class="filter">
        <label for="show-favorites">
          <input type="checkbox" id="show-favorites" />
          Show only my favorite movies</label
        >
      </div>
    </header>
    <main class="movie-cards"></main>
    <footer>
      Made with <3 by @vinilossi
    </footer>
  </body>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="./js/api.js"></script>
  <script type="module" src="./js/API_KEY.js"></script>
  <script type="module" src="./js/search.js"></script>
</html>
