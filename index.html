<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap"
      rel="stylesheet"
    />
    <title>MovieVault — Discover your next favorite movie.</title>
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Popular Movies</h1>
      </div>
      <div class="search-bar">
        <input
          type="text"
          id="search-movie"
          placeholder="Enter a movie to search for..."
        />
      </div>
      <div class="filter">
        <label for="show-favorites">
          <input type="checkbox" id="show-favorites" />
          Show only my favorite movies</label
        >
      </div>
    </header>
    <main class="movie-cards">
    </main>
  </body>
  <script src="js/main.js"></script>
</html>
